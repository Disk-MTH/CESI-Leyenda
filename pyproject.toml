[project]
name = "tounum-cls"
version = "0.1.0"
description = "TouNum - classification binaire photo / non-photo (livrable 1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tensorflow==2.21.0",
    "keras==3.15.1",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "imageio==2.38.0",
    "pillow==12.3.0",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "jupytext==1.19.5",
    "nbconvert==7.17.1",
    "nbformat==5.11.1",
    "ipykernel==7.4.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false  # projet de scripts : le code de src/ est importé via sys.path / pytest.ini, pas installé
