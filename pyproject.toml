[project]
name = "tounum-cls"
version = "0.1.0"
description = "TouNum - photo classification, denoising and captioning (deliverables 1 to 3)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # CUDA libraries on Linux x86_64 (used when an NVIDIA GPU is present, ignored otherwise); plain CPU build elsewhere
    "tensorflow[and-cuda]==2.21.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tensorflow==2.21.0 ; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "keras==3.15.1",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "imageio==2.38.0",
    "pillow==12.3.0",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "jupytext==1.19.5",
    "nbconvert==7.17.1",
    "nbformat==5.11.1",
    "ipykernel==7.4.0",
    "nltk==3.10.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false  # script project: the code in src/ is imported through sys.path / pytest.ini, not installed
